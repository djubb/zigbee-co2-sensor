name: Create Release

# Manually triggered to cut a versioned release with binaries attached.
# Pages deployment is handled automatically by build.yaml on push to main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        target:
          - chip: esp32c6
            flash_freq: 80m
          - chip: esp32h2
            flash_freq: 48m

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: ${{ matrix.target.chip }}
          path: .
          command: |
            idf.py build &&
            idf.py merge-bin -o co2_sensor_${{ matrix.target.chip }}.bin -f raw

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: co2_sensor_${{ matrix.target.chip }}
          path: build/co2_sensor_${{ matrix.target.chip }}.bin

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: co2_sensor_*
          merge-multiple: true

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          generate_release_notes: true
